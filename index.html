<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.ic{width:20px;height:20px;flex:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}
header div{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:6px}
.logo{overflow:hidden;flex:none;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#A8EBC6,#5ED09A);color:var(--gt);display:grid;place-items:center}
header h1{margin:0;min-width:0;font-size:1rem;font-weight:800;flex:1;line-height:1.1}header small{display:block;color:var(--mut);font-weight:400;font-size:.75rem}
.rb{flex:none;position:relative;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:.65rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:800}
main{max-width:760px;margin:0 auto;padding:14px 16px 110px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:760px;margin:0 auto;align-items:flex-end}
nav button{flex:1;background:none;border:0;font:inherit;font-size:.72rem;color:var(--mut);padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--gd);font-weight:800}
nav button.on .ic{background:var(--gl);border-radius:10px;padding:3px;width:28px;height:28px}
nav .fab{flex:none;width:62px;height:62px;border-radius:50%;margin:-22px 6px 4px;background:linear-gradient(135deg,#9BE8BC,#5ED09A);color:var(--gt);box-shadow:0 6px 16px rgba(94,208,154,.5);justify-content:center}
nav .fab .ic{width:28px;height:28px}
.hero{background:linear-gradient(135deg,#E4F8EC,#BDEFD3);border-radius:22px;padding:18px;color:#12432C;margin-bottom:12px}
.hero small{opacity:.8}.hero b{display:block;font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1F3D2C,#2B5A40);color:#E4F3EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(135deg,#1F3D2C,#2B5A40);color:#E4F3EA}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--soft);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.stat .bi{width:38px;height:38px;border-radius:12px;background:var(--gl);color:var(--gd);display:grid;place-items:center;flex:none}
.stat small{color:var(--mut);display:block;font-size:.78rem}.stat b{font-size:1.05rem;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
h2{font-size:1.02rem;margin:16px 0 8px;font-weight:800}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.grow b,.grow small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small,.mut{color:var(--mut)}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 16px;background:var(--g);color:var(--gt);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.soft{background:var(--gl);color:var(--gd)}.btn.red{background:var(--redl);color:var(--red)}.btn.wa{background:#4FE08A;color:#06361B}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:12px}.btn.sq{width:46px;height:46px;padding:0;flex:none}.btn.full{width:100%}
.bar{display:flex;gap:8px;margin-bottom:12px}

label{display:block;font-size:.82rem;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:20px;padding:7px 14px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gl);color:var(--gd);border-color:transparent;font-weight:800}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}
.pc .ph{aspect-ratio:1;width:100%;object-fit:cover;display:grid;place-items:center;background:var(--gl);color:var(--gd)}
.pc .ph .ic{width:40px;height:40px}
.pc .in{padding:10px 12px}.pc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.72rem;padding:2px 9px;border-radius:9px;background:var(--gl);color:var(--gd);font-weight:800;display:inline-block}
.tag.r{background:var(--redl);color:var(--red)}.tag.a{background:var(--ambl);color:var(--amb)}
.alert{border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.alert.r{background:var(--redl);color:var(--red)}.alert.a{background:var(--ambl);color:var(--amb)}.alert .grow{white-space:normal}.alert .grow b,.alert .grow small{white-space:normal;color:inherit}
.chart{display:flex;gap:8px;align-items:flex-end;height:110px}
.chart div{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-size:.72rem;color:var(--mut)}
.chart i{display:block;background:linear-gradient(180deg,#8CE3B3,#5ED09A);border-radius:8px 8px 4px 4px;min-height:3px}
.prog{height:8px;border-radius:4px;background:var(--gl);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--g)}
.ov{position:fixed;inset:0;background:rgba(10,40,26,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{position:relative;background:var(--bg);width:100%;max-width:600px;max-height:93%;overflow:auto;border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 8px;font-size:1.25rem;padding-right:44px}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--gl);color:var(--gd);display:grid;place-items:center;cursor:pointer}
.big{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--soft);border-radius:18px;display:grid;place-items:center;color:var(--gd);margin:8px 0}
.big .ic{width:56px;height:56px}
video{width:100%;border-radius:16px;background:#000;max-height:45vh}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:8px;max-height:230px;overflow:auto}
.tile{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;font-size:.78rem}
.tile .ph{aspect-ratio:1;width:100%;object-fit:cover;display:grid;place-items:center;background:var(--gl);color:var(--gd)}
.tile div.t{padding:5px 7px}.tile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .eye{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--gd);display:grid;place-items:center;padding:0;cursor:pointer}
.eye .ic{width:15px;height:15px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--gl);color:var(--gd);cursor:pointer;display:grid;place-items:center;padding:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:5px;border-radius:16px;margin:6px 0}
.seg button{border:0;border-radius:12px;padding:10px;font:inherit;font-weight:800;background:none;color:var(--mut);cursor:pointer}.seg button.on{background:var(--g);color:var(--gt)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.empty .ic{width:44px;height:44px;color:var(--g);display:block;margin:0 auto 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:30;max-width:90%}
.cdisp{background:var(--soft);border-radius:20px;padding:14px 16px;margin:12px 0 10px;text-align:right}.cexp{font-size:1.9rem;font-weight:800;word-break:break-all;min-height:2.4rem;line-height:1.2}.cout{font-size:1.5rem;font-weight:800;color:var(--gd)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pad button{font:inherit;font-size:1.35rem;font-weight:800;padding:14px 0;border:0;border-radius:16px;background:var(--soft);color:var(--ink);cursor:pointer}.pad button:active{transform:scale(.96)}.pad .op{background:var(--gl);color:var(--gd)}.pad .eq{background:var(--g);color:var(--gt)}.pad .w2{grid-column:span 2}
@keyframes inR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}@keyframes inL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
#app.inR{animation:inR .3s cubic-bezier(.2,.8,.2,1)}#app.inL{animation:inL .3s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){#app.inR,#app.inL{animation:none}}
.nt{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.nt .bi{width:38px;height:38px;border-radius:12px;background:var(--gl);color:var(--gd);display:grid;place-items:center;flex:none}.nt .bi.r{background:var(--redl);color:var(--red)}.nt .bi.a{background:var(--ambl);color:var(--amb)}
</style>

function scan(cb){
  var l=ov('<h3>Escanear código</h3><p class="mut" id="sm">Apunta al código QR o de barras.</p><video id="vid" playsinline muted></video><label for="mc">O escríbelo</label><div class="bar"><input id="mc" placeholder="Código"><button class="btn" id="mok">'+ic('check')+'Usar</button></div>');
  function end(v){stopCam();l.remove();if(v)cb(v)}
  l.querySelector('.x').dataset.a='';l.querySelector('.x').onclick=function(){end()};
  l.querySelector('#mok').onclick=function(){var v=l.querySelector('#mc').value.trim();if(v)end(v)};
  var det=makeDetector();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!det){l.querySelector('#sm').textContent='Este dispositivo no lee códigos con la cámara. Escríbelo en el campo de abajo.';return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){stream=s;var v=l.querySelector('#vid');v.srcObject=s;v.play();var busy=0;timer=setInterval(function(){if(busy)return;busy=1;det(v).then(function(c){busy=0;if(c)end(c)}).catch(function(){busy=0})},350)}).catch(function(){l.querySelector('#sm').textContent='No se pudo abrir la cámara. Revisa el permiso o escribe el código.'})}
function makeDetector(){
  if(window.BarcodeDetector){try{var bd=new BarcodeDetector();return function(v){return bd.detect(v).then(function(r){return r.length?r[0].rawValue:''})}}catch(e){}}
  if(window.ZXing){var rd=new ZXing.MultiFormatReader(),cn=document.createElement('canvas'),h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);rd.setHints(h);return function(v){return new Promise(function(res){if(!v.videoWidth)return res('');var s=Math.min(1,640/v.videoWidth);cn.width=Math.round(v.videoWidth*s);cn.height=Math.round(v.videoHeight*s);cn.getContext('2d').drawImage(v,0,0,cn.width,cn.height);try{res(rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cn)))).getText())}catch(e){res('')}})}}
  return null}
